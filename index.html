<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Breakers - Guess the Code</title>
    <script>
      // Apply saved theme immediately to prevent flash
      (function () {
        var t = localStorage.getItem('code-breakers-theme')
        try {
          t = t ? JSON.parse(t) : 'dark'
        } catch (e) {
          t = 'dark'
        }
        document.documentElement.className = t === 'light' ? 'light' : 'dark'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-nunito">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
